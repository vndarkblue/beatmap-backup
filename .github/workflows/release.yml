name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    env:
      GYP_MSVS_VERSION: '2022'
      npm_config_msvs_version: '2022'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows artifacts
        run: npm run build:win -- --publish never

      - name: Get app version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create Windows portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/win-unpacked/*" -DestinationPath "dist/beatmap-backup-$env:APP_VERSION.zip" -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/*-setup.exe
            dist/beatmap-backup-*.zip
            dist/latest*.yml
          if-no-files-found: error

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux artifacts
        run: npm run build && npx electron-builder --linux AppImage deb --publish never

      - name: Embed AppImage update info & generate .zsync
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          # 1. Locate the built AppImage
          APPIMAGE_FILE=$(ls dist/*.AppImage | head -n 1)
          if [ -z "$APPIMAGE_FILE" ] || [ ! -f "$APPIMAGE_FILE" ]; then
            echo "No AppImage found in dist/"
            exit 1
          fi
          echo "Processing: $APPIMAGE_FILE"

          # 2. Download and prepare official appimagetool
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          mv squashfs-root appimagetool-dir

          # 3. Extract the built AppImage payload
          "$APPIMAGE_FILE" --appimage-extract

          # 4. Repack with appimagetool embedding standard update information
          # This embeds .upd_info into the AppImage and generates $APPIMAGE_FILE.zsync
          UPDATE_INFO="gh-releases-zsync|vndarkblue|beatmap-backup|latest|beatmap-backup-*.AppImage.zsync"
          rm -f "$APPIMAGE_FILE"
          ARCH=x86_64 ./appimagetool-dir/AppRun -u "$UPDATE_INFO" squashfs-root "$APPIMAGE_FILE"

          # 5. Patch latest-linux.yml with the repacked AppImage SHA-512 & size
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const path = require("path");

            const appImage = process.argv[1];
            const ymlPath = "dist/latest-linux.yml";

            if (!fs.existsSync(appImage) || !fs.existsSync(ymlPath)) {
              console.warn("Skipping metadata patch: file not found");
              process.exit(0);
            }

            const data = fs.readFileSync(appImage);
            const sha512 = crypto.createHash("sha512").update(data).digest("base64");
            const size = data.length;
            const filename = path.basename(appImage);

            let content = fs.readFileSync(ymlPath, "utf8");
            content = content.replace(/(^sha512:\s*).*$/m, `$1${sha512}`);

            const lines = content.split(/\r?\n/);
            let inTarget = false;
            const updatedLines = lines.map((line) => {
              const trimmed = line.trim();
              if (trimmed.startsWith("- url:") || trimmed.startsWith("url:")) {
                inTarget = trimmed.includes(filename);
                return line;
              }
              if (inTarget) {
                if (/^\s*sha512:\s*/.test(line)) return line.replace(/(\s*sha512:\s*).*/, `$1${sha512}`);
                if (/^\s*size:\s*/.test(line)) return line.replace(/(\s*size:\s*).*/, `$1${size}`);
                if (!line.startsWith(" ") && !line.startsWith("\t") && line.includes(":")) inTarget = false;
              }
              return line;
            });

            fs.writeFileSync(ymlPath, updatedLines.join("\n"), "utf8");
            console.log(`Updated ${ymlPath} for ${filename} (sha512=${sha512}, size=${size})`);
          ' "$APPIMAGE_FILE"

          # 6. Cleanup temporary extraction artifacts
          rm -rf squashfs-root appimagetool-dir appimagetool

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/*.AppImage
            dist/*.zsync
            dist/*.deb
            dist/latest-linux*.yml
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-linux
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: release-assets

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**
          generate_release_notes: true
