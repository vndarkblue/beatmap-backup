<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <style>
      :root {
        --boot-bg-light: #fafafa;
        --boot-bg-dark: #121212;
        --boot-text-light: #5f6368;
        --boot-text-dark: #c7c9cc;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      html.booting body {
        background: var(--boot-bg-light);
        color: var(--boot-text-light);
      }

      html.booting.theme-dark body {
        background: var(--boot-bg-dark);
        color: var(--boot-text-dark);
      }

      #app {
        min-height: 100%;
      }

      #boot-shell {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        z-index: 9999;
        background: inherit;
        color: inherit;
      }

      #boot-shell .inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      #boot-shell .spinner {
        width: 22px;
        height: 22px;
        border-radius: 999px;
        border: 2px solid currentColor;
        border-right-color: transparent;
        opacity: 0.9;
        animation: boot-spin 0.8s linear infinite;
      }

      #boot-shell .label {
        font-family: var(--font-default, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif);
        font-size: 13px;
        opacity: 0.9;
      }

      @keyframes boot-spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      ;(() => {
        try {
          document.documentElement.classList.add('booting')
          const raw = localStorage.getItem('theme.preference.v1')
          if (raw === 'dark') {
            document.documentElement.classList.add('theme-dark')
          } else {
            document.documentElement.classList.remove('theme-dark')
          }
        } catch {
          document.documentElement.classList.add('booting')
          document.documentElement.classList.remove('theme-dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="boot-shell" aria-hidden="true">
      <div class="inner">
        <div class="spinner"></div>
        <div class="label">Loading Beatmap Backup...</div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
